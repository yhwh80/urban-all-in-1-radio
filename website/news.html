<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban All-in-1 Radio - News</title>
    <meta name="description" content="Latest urban music news, AI-curated. Urban All-in-1 Radio — UK's home for Hip-Hop, R&B, Afrobeats, Dancehall & Drill.">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://urbanallin1radio.co.uk/news.html">
    <meta property="og:title" content="Urban All-in-1 Radio - News">
    <meta property="og:description" content="Latest urban music news, AI-curated. UK's home for Hip-Hop, R&B, Afrobeats, Dancehall & Drill.">
    <meta property="og:image" content="https://urbanallin1radio.co.uk/images/og-preview.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Urban All-in-1 Radio - News">
    <meta name="twitter:description" content="Latest urban music news, AI-curated. UK's home for Hip-Hop, R&B, Afrobeats, Dancehall & Drill.">
    <meta name="twitter:image" content="https://urbanallin1radio.co.uk/images/og-preview.png">

    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
    <style>
        .news-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-color);
            overflow-y: auto;
            padding: 2rem;
            z-index: 100;
        }

        .news-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--hud-color);
        }

        .news-title {
            font-size: 1.5rem;
            color: var(--hud-color);
            letter-spacing: 0.2em;
        }

        .news-title span {
            color: var(--accent);
        }

        .back-btn {
            background: transparent;
            border: 1px solid var(--hud-color);
            color: var(--hud-color);
            padding: 0.5rem 1rem;
            font-family: 'Space Mono', monospace;
            cursor: pointer;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: var(--hud-color);
            color: var(--bg-color);
        }

        .topic-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .topic-tab {
            background: transparent;
            border: 1px solid rgba(0, 245, 255, 0.3);
            color: rgba(0, 245, 255, 0.6);
            padding: 0.75rem 1.5rem;
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.2s;
        }

        .topic-tab:hover {
            border-color: var(--hud-color);
            color: var(--hud-color);
        }

        .topic-tab.active {
            background: var(--hud-color);
            color: var(--bg-color);
            border-color: var(--hud-color);
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        .news-card {
            background: rgba(0, 245, 255, 0.03);
            border: 1px solid rgba(0, 245, 255, 0.15);
            overflow: hidden;
            transition: all 0.2s;
        }

        .news-card:hover {
            border-color: var(--hud-color);
            background: rgba(0, 245, 255, 0.06);
        }

        .news-card-image {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-bottom: 1px solid rgba(0, 245, 255, 0.1);
            background: linear-gradient(135deg, rgba(0, 245, 255, 0.05) 0%, rgba(255, 0, 255, 0.05) 100%);
        }

        .news-card-content {
            padding: 1.5rem;
        }

        .news-card-title {
            color: #fff;
            font-size: 1.1rem;
            margin-bottom: 0.75rem;
            line-height: 1.4;
        }

        .news-card-summary {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.85rem;
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .news-card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--hud-color);
            opacity: 0.7;
        }

        .news-card-link {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.8rem;
        }

        .news-card-link:hover {
            text-decoration: underline;
        }

        .loading {
            text-align: center;
            padding: 4rem;
            color: var(--hud-color);
        }

        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 2px solid rgba(0, 245, 255, 0.2);
            border-top-color: var(--hud-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error-msg {
            text-align: center;
            padding: 2rem;
            color: var(--accent);
        }
    </style>
</head>

<body>
    <div class="news-container">
        <!-- Header -->
        <div class="news-header">
            <h1 class="news-title">URBAN <span>//</span> NEWS</h1>
            <button class="back-btn" onclick="window.location.href='index.html'">← BACK TO RADIO</button>
        </div>

        <!-- Topic Tabs -->
        <div class="topic-tabs">
            <button class="topic-tab active" data-topic="hiphop">🎤 HIP-HOP</button>
            <button class="topic-tab" data-topic="basketball">🏀 NBA</button>
            <button class="topic-tab" data-topic="football">⚽ FOOTBALL</button>
            <button class="topic-tab" data-topic="f1">🏎️ F1</button>
            <button class="topic-tab" data-topic="tech">🤖 TECH</button>
            <button class="topic-tab" data-topic="entertainment">🎬 ENTERTAINMENT</button>
        </div>

        <!-- News Content -->
        <div id="newsContent">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p style="margin-top: 1rem;">FETCHING LATEST NEWS...</p>
            </div>
        </div>
    </div>

    <script>
        const newsContent = document.getElementById('newsContent');
        const topicTabs = document.querySelectorAll('.topic-tab');
        let currentTopic = 'hiphop';

        // RSS news backend (Convex). Replaced the Supabase edge function, whose
        // project was deleted — every request returned CONNECTION_ERROR.
        const NEWS_API = 'https://hip-hummingbird-200.convex.site/news';

        // Fetch news from the RSS backend
        async function fetchNews(topic) {
            newsContent.innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p style="margin-top: 1rem;">SCANNING ${topic.toUpperCase()} FEEDS...</p>
                </div>
            `;

            try {
                const response = await fetch(`${NEWS_API}?topic=${encodeURIComponent(topic)}`);
                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error);
                }

                if (Array.isArray(data.news)) {
                    renderNews(data.news);
                } else {
                    throw new Error('Unexpected response from news service');
                }
            } catch (error) {
                console.error('Error fetching news:', error);
                newsContent.innerHTML = `
                    <div class="error-msg">
                        <p>CONNECTION_ERROR</p>
                        <p style="font-size: 0.8rem; opacity: 0.6; margin-top: 0.5rem;">${error.message}</p>
                        <button class="back-btn" style="margin-top: 1rem;" onclick="fetchNews('${topic}')">RETRY</button>
                    </div>
                `;
            }
        }

        // Curated fallback images by topic (Unsplash direct URLs - no redirects)
        const fallbackImages = {
            uk: [
                'https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=400&h=200&fit=crop', // concert crowd
                'https://images.unsplash.com/photo-1571266028243-3716f02d2d2e?w=400&h=200&fit=crop', // dj mixing
                'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=400&h=200&fit=crop', // neon concert
                'https://images.unsplash.com/photo-1501386761578-eac5c94b800a?w=400&h=200&fit=crop', // festival crowd
            ],
            hiphop: [
                'https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=400&h=200&fit=crop', // concert
                'https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?w=400&h=200&fit=crop', // studio mic
                'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400&h=200&fit=crop', // headphones
                'https://images.unsplash.com/photo-1571266028243-3716f02d2d2e?w=400&h=200&fit=crop', // dj
            ],
            basketball: [
                'https://images.unsplash.com/photo-1546519638-68e109498ffc?w=400&h=200&fit=crop', // basketball court
                'https://images.unsplash.com/photo-1504450758481-7338eba7524a?w=400&h=200&fit=crop', // basketball hoop
                'https://images.unsplash.com/photo-1519861531473-9200262188bf?w=400&h=200&fit=crop', // basketball
                'https://images.unsplash.com/photo-1574623452334-1e0ac2b3ccb4?w=400&h=200&fit=crop', // nba court
            ],
            football: [
                'https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=400&h=200&fit=crop', // football pitch
                'https://images.unsplash.com/photo-1553778263-73a83bab9b0c?w=400&h=200&fit=crop', // football
                'https://images.unsplash.com/photo-1522778119026-d647f0596c20?w=400&h=200&fit=crop', // stadium
                'https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=400&h=200&fit=crop', // goal net
            ],
            f1: [
                'https://images.unsplash.com/photo-1568605117036-5fe5e7bab0b7?w=400&h=200&fit=crop', // race car
                'https://images.unsplash.com/photo-1541348263662-e068662d82af?w=400&h=200&fit=crop', // f1 helmet
                'https://images.unsplash.com/photo-1504817343863-5092a923803e?w=400&h=200&fit=crop', // race track
                'https://images.unsplash.com/photo-1580341289255-5b47c98a59dd?w=400&h=200&fit=crop', // racing
            ],
            tech: [
                'https://images.unsplash.com/photo-1677442136019-21780ecad995?w=400&h=200&fit=crop', // AI brain
                'https://images.unsplash.com/photo-1518770660439-4636190af475?w=400&h=200&fit=crop', // circuit board
                'https://images.unsplash.com/photo-1550751827-4bd374c3f58b?w=400&h=200&fit=crop', // cyber security
                'https://images.unsplash.com/photo-1485827404703-89b55fcc595e?w=400&h=200&fit=crop', // robot
            ],
            entertainment: [
                'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=400&h=200&fit=crop', // cinema seats
                'https://images.unsplash.com/photo-1440404653325-ab127d49abc1?w=400&h=200&fit=crop', // film reel
                'https://images.unsplash.com/photo-1598899134739-24c46f58b8c0?w=400&h=200&fit=crop', // red carpet
                'https://images.unsplash.com/photo-1616530940355-351fabd9524b?w=400&h=200&fit=crop', // streaming
            ]
        };

        // Get themed fallback image
        function getImage(topic, index) {
            const images = fallbackImages[topic] || fallbackImages.uk;
            return images[index % images.length];
        }

        // Render news cards
        // Feed content is third-party HTML, so it must never reach innerHTML raw.
        function esc(str) {
            return String(str ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[c]);
        }

        // Only http(s) links are rendered — a feed could otherwise supply javascript:.
        function safeUrl(u) {
            try {
                const parsed = new URL(u);
                return (parsed.protocol === 'http:' || parsed.protocol === 'https:') ? parsed.href : '';
            } catch { return ''; }
        }

        // Computed in the browser rather than server-side, so it stays correct
        // while a response is served from the 15-minute cache.
        function timeAgo(ts) {
            const mins = Math.floor((Date.now() - ts) / 60000);
            if (!ts || mins < 0) return 'Recent';
            if (mins < 1) return 'Just now';
            if (mins < 60) return `${mins}m ago`;
            const hrs = Math.floor(mins / 60);
            if (hrs < 24) return `${hrs}h ago`;
            const days = Math.floor(hrs / 24);
            return days === 1 ? 'Yesterday' : `${days}d ago`;
        }

        function renderNews(news) {
            if (!news.length) {
                newsContent.innerHTML = '<div class="error-msg">NO_DATA_AVAILABLE</div>';
                return;
            }

            newsContent.innerHTML = `
                <div class="news-grid">
                    ${news.map((story, index) => {
                        const fallback = getImage(currentTopic, index);
                        const img = safeUrl(story.image) || fallback;
                        const link = safeUrl(story.url);
                        return `
                        <article class="news-card">
                            <img src="${esc(img)}"
                                 alt=""
                                 class="news-card-image"
                                 loading="lazy"
                                 onerror="this.onerror=null;this.src='${esc(fallback)}'">
                            <div class="news-card-content">
                                <h3 class="news-card-title">${esc(story.title)}</h3>
                                <p class="news-card-summary">${esc(story.summary)}</p>
                                <div class="news-card-meta">
                                    <span>${esc(story.source || 'Source')} \u00b7 ${esc(timeAgo(story.pubDate))}</span>
                                    ${link ? `<a href="${esc(link)}" target="_blank" rel="noopener noreferrer" class="news-card-link">READ MORE \u2192</a>` : ''}
                                </div>
                            </div>
                        </article>`;
                    }).join('')}
                </div>
            `;
        }

        // Tab click handlers
        topicTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                topicTabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentTopic = tab.dataset.topic;
                fetchNews(currentTopic);
            });
        });

        // Initial load
        fetchNews(currentTopic);
    </script>

    <!-- Mini Player for auto-resume -->
    <audio id="radioStream" preload="none"></audio>
    <div id="miniPlayer"
        style="display:none; position:fixed; bottom:20px; left:20px; right:20px; max-width:400px; background:rgba(10,10,15,0.95); border:1px solid var(--hud-dim); padding:1rem; border-radius:4px; z-index:200;">
        <div style="display:flex; align-items:center; gap:1rem;">
            <button id="miniPlayBtn"
                style="background:var(--hud-color); border:none; color:var(--bg-color); width:40px; height:40px; border-radius:50%; cursor:pointer; font-size:1.2rem;">⏸</button>
            <div style="flex:1; min-width:0;">
                <p id="miniTitle"
                    style="margin:0; font-size:0.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                    Loading...</p>
                <p id="miniArtist" style="margin:0; font-size:0.75rem; color:var(--hud-dim);">Urban Radio</p>
            </div>
            <div
                style="width:8px; height:8px; background:var(--hud-color); border-radius:50%; animation:pulse 1.5s infinite;">
            </div>
        </div>
    </div>

	    <script>
	        (function () {
	            const RADIO_CONFIG = {
	                streamUrl: 'https://stream.urbanallin1radio.co.uk/listen/urban_all_in_1_radio/radio.mp3',
	                nowPlayingUrl: 'https://stream.urbanallin1radio.co.uk/api/nowplaying/urban_all_in_1_radio'
	            };

            const radioStream = document.getElementById('radioStream');
            const miniPlayer = document.getElementById('miniPlayer');
            const miniPlayBtn = document.getElementById('miniPlayBtn');
            const miniTitle = document.getElementById('miniTitle');
            const miniArtist = document.getElementById('miniArtist');

            let isPlaying = false;
            radioStream.src = RADIO_CONFIG.streamUrl;

            const savedVolume = localStorage.getItem('urbanRadioVolume');
            radioStream.volume = savedVolume ? parseFloat(savedVolume) : 0.7;

            function togglePlay() {
                if (isPlaying) {
                    radioStream.pause();
                    miniPlayBtn.textContent = '▶';
                    localStorage.setItem('urbanRadioPlaying', 'false');
                } else {
                    radioStream.play().catch(e => console.error(e));
                    miniPlayBtn.textContent = '⏸';
                    localStorage.setItem('urbanRadioPlaying', 'true');
                }
                isPlaying = !isPlaying;
            }

            miniPlayBtn.addEventListener('click', togglePlay);

            async function fetchNowPlayingRadio() {
                try {
                    const res = await fetch(RADIO_CONFIG.nowPlayingUrl);
                    const data = await res.json();
                    // AzuraCast format: now_playing.song carries artist and title separately
                    const song = data?.now_playing?.song;
                    if (song) {
                        const title  = song.title  || 'Unknown Track';
                        const artist = song.artist || 'Urban Radio';
                        miniTitle.textContent  = title;
                        miniArtist.textContent = artist;
                    }
                } catch (e) { console.error(e); }
            }

            if (localStorage.getItem('urbanRadioPlaying') === 'true') {
                miniPlayer.style.display = 'block';
                togglePlay();
                fetchNowPlayingRadio();
                setInterval(fetchNowPlayingRadio, 5000);
            }
        })();
    </script>
</body>

</html>
